name: coolifybruecke
version: "0.2.4"
description: "Coolifybrücke · a cockpit for Coolify: see what needs you across your Coolify instance, deploy with your approval, and let Hermes explain failed deploys."
author: "Studio Luftbrücke"
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - coolify_capabilities
  - coolify_overview
  - coolify_deployments
  - coolify_diagnose
  - coolify_action
  - coolify_cockpit
  - coolify_notes
provides_hooks:
  - pre_tool_call
  - post_approval_response
config_schema:
  COOLIFYBRUECKE_URL:
    type: string
    label: "Coolify URL"
    description: "The address you open Coolify at, e.g. https://coolify.example.com"
  COOLIFYBRUECKE_TOKEN:
    type: secret
    env: COOLIFYBRUECKE_TOKEN
    label: "API token"
    description: "Coolify: Keys & Tokens, API tokens. Recommended: read and deploy, all projects."
  protected_environments:
    type: string
    default: "production"
    label: "Protected environments"
    description: "Comma-separated. The agent may not act here unless the next switch is on; your own clicks always work."
  agent_on_protected:
    type: boolean
    default: false
    label: "Agent may act on protected environments"
    description: "Off: the agent is refused there. On: each action still asks you, naming the environment."
  agent_actions:
    type: boolean
    default: true
    label: "Let the agent run actions"
    description: "Each agent action asks you first. Refused in cron jobs, webhooks and one-shot runs."
  disk_warn_percent:
    type: integer
    default: 85
    label: "Disk warning at (%)"
    description: "A server at or over this disk use needs attention."
  memory_warn_percent:
    type: integer
    default: 90
    label: "Memory warning at (%)"
    description: "A server at or over this memory use needs attention."
  check_updates:
    type: boolean
    default: true
    label: "Check for Coolify updates"
    description: "Compares your version with Coolify's release feed at cdn.coollabs.io."
  COOLIFYBRUECKE_READ_TOKEN:
    type: secret
    env: COOLIFYBRUECKE_READ_TOKEN
    label: "Read-only token (optional)"
    description: "Only if your API token is limited to some projects: a team-wide read token shows servers and every app. Never acts."
  COOLIFYBRUECKE_GIT_TOKEN:
    type: secret
    env: COOLIFYBRUECKE_GIT_TOKEN
    label: "Git host token (optional)"
    description: "Read-only, for private repos without Forgebrücke: shows when a branch is ahead of what runs."
  git_host:
    type: string
    label: "Git host of that token (optional)"
    description: "Where the git host token is sent, e.g. git.example.com. Leave empty for a GitHub token."
